<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .email-container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header img {
      max-height: 50px;
      display: block;
      margin: 0 auto 10px;
    }
    .content {
      padding: 20px;
      color: #333333;
    }
    .button {
      display: inline-block;
      background-color: #27ae60;
      color: white;
      padding: 10px 20px;
      margin-top: 20px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">
      <h1>{{EmailHeader}}</h1>
        <small>This is an automated message please do not reply</small>
    </div>
    <div class="content">
        <p>Dear {{FirstName}},</p>
        <p>{{MessageBody}}</p>
    </div>
    </div>
</body>
</html>
